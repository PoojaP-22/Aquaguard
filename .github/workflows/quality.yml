name: AquaGuard quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, aquaguard-2.0]

permissions:
  contents: read

concurrency:
  group: aquaguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  backend:
    name: Backend syntax and dependency checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app
      - name: Run scoring service tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p 'test_scoring_services.py' -v
      - name: Check installed dependency consistency
        run: python -m pip check
